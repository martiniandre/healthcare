name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'scripts/conventions-check.mjs'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'scripts/conventions-check.mjs'
      - '.github/workflows/ci-backend.yml'

jobs:
  backend-validation:
    name: Backend Validation (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_ADMIN_DB_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      REDIS_URL: localhost:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Conventions check
        run: node scripts/conventions-check.mjs

      - name: Go build
        working-directory: backend
        run: go build ./...

      - name: Go vet
        working-directory: backend
        run: go vet ./...

      - name: Go test (race, includes integration tests against Postgres and Redis)
        working-directory: backend
        run: go test -race ./internal/...

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.4

      - name: Swagger drift check
        working-directory: backend
        run: |
          swag init -g cmd/api/main.go -o cmd/api/docs --parseInternal --parseDependency --parseDepth 1
          git diff --exit-code -- cmd/api/docs

  backend-security:
    name: Backend Security and Lint (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: govulncheck
        working-directory: backend
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: golangci-lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          working-directory: backend
