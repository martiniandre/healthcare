name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: healthcare-api
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Build and push Docker image
        id: build
        working-directory: backend
        run: |
          IMAGE=${{ env.ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_REPO }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  migrate:
    name: Run Database Migrations
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Create or update migration job
        run: |
          gcloud run jobs deploy ${{ env.CLOUD_RUN_SERVICE }}-migrate \
            --image ${{ needs.build.outputs.image }} \
            --command /app/migrate \
            --region ${{ env.GCP_REGION }} \
            --max-retries 0 \
            --task-timeout 600 \
            --set-env-vars "DB_URL=${{ secrets.CLOUD_RUN_DB_URL }}" \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Execute migration job
        run: |
          gcloud run jobs execute ${{ env.CLOUD_RUN_SERVICE }}-migrate \
            --region ${{ env.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --wait

  deploy:
    name: Deploy to Cloud Run
    needs: [build, migrate]
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image ${{ needs.build.outputs.image }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars "^@^APP_ENV=production@RUN_MIGRATIONS_ON_START=false@GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}@GCP_LOCATION_ID=${{ secrets.GCP_LOCATION_ID }}@GCP_DATASET_ID=${{ secrets.GCP_DATASET_ID }}@GCP_FHIR_STORE_ID=${{ secrets.GCP_FHIR_STORE_ID }}@GCP_VERTEX_MODEL=${{ secrets.GCP_VERTEX_MODEL }}@GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}@DB_URL=${{ secrets.CLOUD_RUN_DB_URL }}@REDIS_URL=${{ secrets.CLOUD_RUN_REDIS_URL }}@JWT_SECRET=${{ secrets.CLOUD_RUN_JWT_SECRET }}@SENTRY_DSN=${{ secrets.SENTRY_DSN }}" \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify deployment health
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format 'value(status.url)')
          echo "Service URL: $SERVICE_URL"
          curl --fail --silent --max-time 30 "$SERVICE_URL/health" || exit 1
          echo "Health check passed"
