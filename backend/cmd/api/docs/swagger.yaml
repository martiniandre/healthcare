host: localhost:8080
info:
  contact:
    email: support@healthcare.com
    name: API Support
  description: Healthcare platform API with FHIR R4 interoperability
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Healthcare API
  version: "1.0"
paths:
  /analytics:
    get:
      consumes:
      - application/json
      description: Returns aggregated healthcare statistics including patient counts,
        consultation data, and exam modality distribution
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_analytics.Stats'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get analytics statistics
      tags:
      - analytics
  /analytics/dashboard:
    get:
      consumes:
      - application/json
      description: Returns aggregated KPIs for the clinical dashboard including consultations,
        occupancy, wait times, and diagnoses
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_analytics.DashboardData'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get clinical dashboard data
      tags:
      - analytics
  /analytics/dashboard/avg-wait-time:
    get:
      consumes:
      - application/json
      description: Returns average wait time by department for the dashboard
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_analytics.AvgWaitTime'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get average wait time
      tags:
      - analytics
  /analytics/dashboard/consultations-per-doctor:
    get:
      consumes:
      - application/json
      description: Returns consultations grouped by doctor for the dashboard
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_modules_analytics.DoctorConsultation'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get consultations per doctor
      tags:
      - analytics
  /analytics/dashboard/occupancy-rate:
    get:
      consumes:
      - application/json
      description: Returns bed/room occupancy rate for the dashboard
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_analytics.OccupancyRate'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get occupancy rate
      tags:
      - analytics
  /analytics/dashboard/top-diagnoses:
    get:
      consumes:
      - application/json
      description: Returns the most common diagnoses for the dashboard
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_modules_analytics.DiagnosisCount'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get top diagnoses
      tags:
      - analytics
  /appointments:
    get:
      consumes:
      - application/json
      description: Lists appointments filtered by patient or by staff on a date
      parameters:
      - description: Patient FHIR ID
        in: query
        name: patient_fhir_id
        type: string
      - description: Staff UUID
        in: query
        name: staff_id
        type: string
      - description: Date (YYYY-MM-DD) for staff listing
        in: query
        name: date
        type: string
      - description: Range start date (YYYY-MM-DD), requires end_date
        in: query
        name: start_date
        type: string
      - description: Range end date (YYYY-MM-DD), requires start_date
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_modules_schedule.AppointmentResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List appointments
      tags:
      - appointments
    post:
      consumes:
      - application/json
      description: Books a time slot for a patient with a staff member (idempotent)
      parameters:
      - description: Appointment data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_schedule.CreateAppointmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_schedule.AppointmentResponse'
