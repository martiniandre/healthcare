        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_imaging.HTTPImagingStudyResponse'
        "400":
          description: Bad Request
