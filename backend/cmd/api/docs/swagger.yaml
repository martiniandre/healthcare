  /patients/{patientFhirId}/timeline:
    get:
      consumes:
      - application/json
      description: Returns a chronological feed merging the patient's Encounter, Observation,
        Condition, AllergyIntolerance, MedicationRequest, DiagnosticReport and ImagingStudy
        records, ordered by recorded time (newest first) with cursor pagination. When
        some resource types cannot be loaded, the rest is returned and partial.failedTypes
        lists the unavailable types. Defaults to the last 6 months.
      parameters:
      - description: Patient FHIR ID
        in: path
        name: patientFhirId
        required: true
        type: string
      - description: Window start (ISO date or RFC3339). Defaults to 6 months before
          now
        in: query
        name: from
        type: string
      - description: Window end (ISO date or RFC3339). Defaults to now
        in: query
        name: to
        type: string
      - description: 'Comma separated list: encounter,observation,condition,allergy,medication,report,imaging'
        in: query
        name: types
        type: string
      - description: Opaque cursor returned as nextCursor
        in: query
        name: cursor
        type: string
      - default: 30
        description: Page size (1-100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_timeline.TimelineResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get patient clinical timeline
      tags:
      - timeline
