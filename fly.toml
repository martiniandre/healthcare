# fly.toml app configuration file generated for healthcare-api-small-dust-5285 on 2026-08-16T19:56:06-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'healthcare-api-small-dust-5285'
primary_region = 'gru'

[build]

[env]
  APP_ENV = 'production'
  HTTP_PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
